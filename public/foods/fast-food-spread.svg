<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" fill="none" role="img" aria-label="A hand-drawn cheeseburger overlapping a tipped carton of fries, with pepperoni pizza and a striped takeaway drink on crumpled checked tray paper">
